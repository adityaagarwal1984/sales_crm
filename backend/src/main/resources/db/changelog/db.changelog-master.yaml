              - column: { name: next_follow_up_at, type: timestamp with time zone }
              - column: { name: created_at, type: timestamp with time zone, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: call_activity
            baseColumnNames: lead_id
            referencedTableName: sales_lead
            referencedColumnNames: id
            constraintName: fk_call_activity_lead
        - addForeignKeyConstraint:
            baseTableName: call_activity
