databaseChangeLog:
  - changeSet:
      id: 001-create-identity-tables
      author: prosperr
      changes:
        - createTable:
            tableName: app_role
            columns:
              - column:
                  name: code
                  type: varchar(32)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: display_name
                  type: varchar(80)
                  constraints:
                    nullable: false
        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: full_name
                  type: varchar(120)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(320)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_app_user_email
              - column:
                  name: password_hash
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: role_code
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: must_change_password
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: credentials_changed_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: app_user
            baseColumnNames: role_code
            referencedTableName: app_role
            referencedColumnNames: code
            constraintName: fk_app_user_role
        - sql:
            sql: CREATE UNIQUE INDEX uq_app_user_email_normalized ON app_user (lower(email));
            dbms: postgresql
        - insert:
            tableName: app_role
            columns:
              - column: { name: code, value: ADMIN }
              - column: { name: display_name, value: Administrator }
        - insert:
            tableName: app_role
            columns:
              - column: { name: code, value: BDR }
              - column: { name: display_name, value: Business Development }
        - insert:
            tableName: app_role
            columns:
              - column: { name: code, value: SALES_MANAGER }
              - column: { name: display_name, value: Sales Manager }
        - insert:
            tableName: app_role
            columns:
              - column: { name: code, value: AE }
              - column: { name: display_name, value: Account Executive }
        - insert:
            tableName: app_role
            columns:
              - column: { name: code, value: LEADERSHIP }
              - column: { name: display_name, value: Leadership }
  - changeSet:
      id: 002-create-organisation-contact-tables
      author: prosperr
      changes:
        - createTable:
            tableName: organisation
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: name, type: varchar(180), constraints: { nullable: false } }
              - column: { name: website, type: varchar(500) }
              - column: { name: industry, type: varchar(120) }
              - column: { name: company_size, type: varchar(80) }
              - column: { name: location, type: varchar(180) }
              - column: { name: address, type: varchar(10000) }
              - column: { name: lead_source, type: varchar(120) }
              - column: { name: description, type: varchar(10000) }
              - column: { name: created_by, type: uuid, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp with time zone, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp with time zone, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: version, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: organisation
            baseColumnNames: created_by
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_organisation_created_by
        - sql:
            sql: CREATE UNIQUE INDEX uq_organisation_name_normalized ON organisation (lower(btrim(name)));
            dbms: postgresql
        - createTable:
            tableName: contact
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: organisation_id, type: uuid, constraints: { nullable: false } }
              - column: { name: name, type: varchar(180), constraints: { nullable: false } }
              - column: { name: email, type: varchar(320) }
              - column: { name: phone, type: varchar(40) }
              - column: { name: designation, type: varchar(120) }
              - column: { name: department, type: varchar(120) }
              - column: { name: linkedin_url, type: varchar(500) }
              - column: { name: created_at, type: timestamp with time zone, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp with time zone, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: version, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: contact
            baseColumnNames: organisation_id
            referencedTableName: organisation
            referencedColumnNames: id
            constraintName: fk_contact_organisation
        - createIndex:
            tableName: contact
            indexName: ix_contact_organisation
            columns:
              - column: { name: organisation_id }
        - sql:
            sql: CREATE UNIQUE INDEX uq_contact_org_email_normalized ON contact (organisation_id, lower(btrim(email))) WHERE email IS NOT NULL AND btrim(email) <> '';
            dbms: postgresql
  - changeSet:
      id: 003-create-bdr-prospecting-tables
      author: prosperr
      changes:
        - addColumn:
            tableName: contact
            columns:
              - column: { name: created_by, type: uuid }
        - sql:
            sql: UPDATE contact c SET created_by = o.created_by FROM organisation o WHERE c.organisation_id = o.id AND c.created_by IS NULL;
            dbms: postgresql
        - addNotNullConstraint:
            tableName: contact
            columnName: created_by
            columnDataType: uuid
        - addForeignKeyConstraint:
            baseTableName: contact
            baseColumnNames: created_by
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_contact_created_by
        - createTable:
            tableName: sales_lead
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: title, type: varchar(180), constraints: { nullable: false } }
              - column: { name: description, type: varchar(10000) }
              - column: { name: organisation_id, type: uuid, constraints: { nullable: false } }
              - column: { name: primary_contact_id, type: uuid, constraints: { nullable: false } }
              - column: { name: owner_id, type: uuid, constraints: { nullable: false } }
              - column: { name: created_by, type: uuid, constraints: { nullable: false } }
              - column: { name: last_call_outcome, type: varchar(32) }
              - column: { name: last_call_at, type: timestamp with time zone }
              - column: { name: created_at, type: timestamp with time zone, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp with time zone, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: version, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: sales_lead
            baseColumnNames: organisation_id
            referencedTableName: organisation
            referencedColumnNames: id
            constraintName: fk_sales_lead_organisation
        - addForeignKeyConstraint:
            baseTableName: sales_lead
            baseColumnNames: primary_contact_id
            referencedTableName: contact
            referencedColumnNames: id
            constraintName: fk_sales_lead_primary_contact
        - addForeignKeyConstraint:
            baseTableName: sales_lead
            baseColumnNames: owner_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_sales_lead_owner
        - addForeignKeyConstraint:
            baseTableName: sales_lead
            baseColumnNames: created_by
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_sales_lead_created_by
        - createIndex:
